spring.application.name=RoomMate_Filter

# === Local secrets ===
# Load .env (gitignored, .properties syntax) as a property source so IDE / `mvnw spring-boot:run`
# runs get the same credentials docker-compose injects. Optional: in Docker the file is absent and
# the values arrive as real environment variables instead, which take precedence over this import.
spring.config.import=optional:file:./.env[.properties]

# === Server Config ===
server.port=${SERVER_PORT:8010}

# === PostgreSQL Config ===
# Use environment variables for credentials in production.
# Local defaults target the Docker-mapped PostgreSQL port on host (5434). Not 5433 — that port is
# held by an unrelated leftover Postgres cluster with a same-named database, so pointing here at
# 5433 silently connects to the wrong data.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/roommate_filter}
spring.datasource.username=${DB_USERNAME:roommate_user}
# REQUIRED: no default. Set DB_PASSWORD in .env / the environment. Startup fails fast if missing.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA/Hibernate ===
# 'update' preserves schema between restarts. For production use migrations (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kathmandu

# Keep JSON timestamps aligned with the app timezone.
spring.jackson.time-zone=Asia/Kathmandu

# === Redis (OTP storage + login rate limiting) ===
# Previously unmapped: REDIS_HOST/REDIS_PORT were set in docker-compose but never read, so Redis
# always resolved to localhost and OTP verification broke outside a single-host setup.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT
# REQUIRED: no default. Must be a strong secret supplied via the environment.
jwt.secret=${JWT_SECRET}

# === Email Verification (Spring Mail) ===
# Do NOT hardcode credentials. Use environment variables or a secrets manager.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:nimeshnepal.codehimalaya@gmail.com}
# REQUIRED: set MAIL_PASSWORD in your .env file or environment — do not hardcode here
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Inbox that receives Help & Support submissions. Sent from spring.mail.username.
app.support.recipient=${SUPPORT_RECIPIENT:nimeshnepal19@gmail.com}

# === Firebase Admin SDK (Optional for Chat) ===
# You'll also need to add the service account key JSON file
#firebase.config.path=classpath:firebase-service-account.json

# === Actuator ===
# Health only — the compose/EC2 healthcheck target. No other endpoints are exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Mail failures are handled gracefully at the application level (see UserLoginService /
# HelpSupportService) and must not fail the container healthcheck — an SMTP outage is not the
# same as the app being unable to serve requests.
management.health.mail.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Image storage folder (persisted in Docker via the mounted image volume)
app.image.folder=${IMAGE_FOLDER:/app/images}
