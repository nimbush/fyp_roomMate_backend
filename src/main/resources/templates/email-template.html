<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            max-width: 600px;
            margin: auto;
        }
        .header {
            text-align: center;
            color: #ffffff;
            background-color: #007bff;
            padding: 10px;
            border-radius: 10px 10px 0 0;
        }
        .banner-image {
            text-align: center;
            margin-top: 20px;
        }
        .banner-image img {
            width: 100%;
            max-width: 600px;
            border-radius: 10px;
        }
        .footer {
            font-size: 12px;
            color: #666;
            margin-top: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>Welcome to Our Service</h2>
    </div>
    <p>Hello,</p>
    <p>Please use the following verification code to log into the system:</p>
    <p><strong>{{verification_code}}</strong></p>


    <div class="banner-image">
        <!-- Banner image from external URL -->
        <img src="https://via.placeholder.com/600x200.png?text=Banner+Image" width="600" alt="Banner"/>
    </div>

    <div class="footer">
        <p>&copy; 2025 Our Company. All rights reserved.</p>
    </div>
</div>
</body>
</html>
